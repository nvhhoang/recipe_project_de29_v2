log_format recipe_json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,"referer":"$http_referer","user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 2m;
    access_log /var/log/nginx/recipe-access.log recipe_json;
    error_log /var/log/nginx/recipe-error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self' https: data:; style-src 'self' https: 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' https: data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Allow only the fixed Prometheus container IP. The host-published port cannot read app metrics.
    location = /metrics {
        allow 172.30.240.10;
        deny all;
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/metrics.php;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 10s;
    }
    location = /metrics.php { deny all; return 404; }

    # Allow only the fixed Nginx exporter container IP.
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 172.30.240.11;
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
        fastcgi_read_timeout 30s;
    }

    location ~ /\. { deny all; }
    location ~* \.(?:sql|ini|log|conf|ya?ml|env|bak|dist)$ { deny all; }
}

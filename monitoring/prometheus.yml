global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: recipe-de29

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: recipe-app
    metrics_path: /metrics
    static_configs:
      - targets: ["nginx:80"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

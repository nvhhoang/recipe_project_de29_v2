groups:
  - name: recipe-system-alerts
    rules:
      - alert: RecipeScrapeTargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus target is down"
          description: "Target {{ $labels.job }} at {{ $labels.instance }} has been down for more than one minute."
      - alert: RecipeDatabaseUnavailable
        expr: mysql_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Recipe database unavailable"
          description: "The application metrics endpoint cannot query MySQL."
